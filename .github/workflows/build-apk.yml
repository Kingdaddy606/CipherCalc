name: Build CipherCalc APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Extract ZIP and Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Extract CipherCalc source ZIP
        run: |
          set -eu

          ZIP_FILE="CipherCalc-Full-Source-THEME-FIX.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Required ZIP not found: $ZIP_FILE"
            echo "ZIP files in the repository:"
            find . -maxdepth 2 -type f -name "*.zip"
            exit 1
          fi

          mkdir -p extracted_source
          unzip -q "$ZIP_FILE" -d extracted_source

          echo "ZIP extracted successfully."

      - name: Find Android project
        id: project
        run: |
          set -eu

          SETTINGS_FILE="$(find extracted_source \
            -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: No Gradle settings file was found in the ZIP."
            find extracted_source -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "Project directory: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        id: build
        run: |
          set -eu

          cd "${{ steps.project.outputs.project_dir }}"

          gradle assembleDebug --stacktrace

          APK_FILE="$(find app/build/outputs/apk/debug \
            -type f -name "*.apk" -print -quit)"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK generated: $APK_FILE"
          echo "apk_path=${{ steps.project.outputs.project_dir }}/$APK_FILE" \
            >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CipherCalc-debug-apk
          path: ${{ steps.build.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14
